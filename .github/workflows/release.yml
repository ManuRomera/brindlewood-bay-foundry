name: Publicar versión Foundry

on:
  push:
    branches: [main]
    paths:
      - system.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build

      - name: Leer versión
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('system.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; no se vuelve a publicar."
            exit 0
          fi

          EXTRA=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA+=(--prerelease)
          fi

          gh release create "$TAG"             dist/brindlewood-bay.zip             dist/system.json             dist/SHA256SUMS             --target "$GITHUB_SHA"             --title "Brindlewood Bay $VERSION"             --notes "Paquete de Foundry VTT generado automáticamente desde la versión $VERSION."             "${EXTRA[@]}"
