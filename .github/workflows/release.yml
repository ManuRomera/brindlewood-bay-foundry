name: Publicar
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validar etiqueta, manifiesto y código
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check
      - run: npm test
      - name: Compilar compendios y empaquetar
        run: npm run build
      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="# $version" '$0==v{p=1;next} /^# /{p=0} p' CHANGELOG.md > dist/notas.md
          test -s dist/notas.md || echo "Versión $version." > dist/notas.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/brindlewood-bay.zip dist/system.json dist/SHA256SUMS --title "Brindlewood Bay $GITHUB_REF_NAME" --notes-file dist/notas.md
